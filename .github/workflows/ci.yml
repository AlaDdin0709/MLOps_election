name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  PYTHONUNBUFFERED: 1
  MLFLOW_EXPERIMENT: sentiment_classification_tunisian_v2

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install training requirements
        run: |
          pip install -r requirements.txt

      - name: Configure DVC remote
        run: |
          dvc remote modify origin endpointurl https://dagshub.com/api/v1/repo-buckets/s3/AlaDdin0709
          dvc remote modify origin access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          dvc remote modify origin secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Pull data from DVC
        run: |
          dvc pull -v
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check data presence (Debug)
        run: |
          ls -R data/
          
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend requirements
        run: |
          pip install -r frontend/requirements.txt

      - name: Run training (also saves model + vectorizer locally)
        run: |
          python scripts/train.py
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}

      # No need to run register_best_model.py here - train.py already saves
      # model and vectorizer locally for smoke tests. register_best_model.py
      # is run in the deploy job to download production artifacts from MLflow.

      - name: Install uvicorn (for smoke tests)
        run: |
          pip install "uvicorn[standard]"

      - name: Start backend (uvicorn)
        run: |
          nohup uvicorn backend.src.api:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo 000)
            echo "Attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "Backend did not become healthy"; exit 1

      - name: Smoke check backend endpoints
        run: |
          curl -sS http://localhost:8000/health

      - name: Stop uvicorn (free port 8000)
        run: |
          pkill -f uvicorn || true
          sleep 2

      - name: Build and deploy with Docker Compose (Local Check)
        run: |
          docker compose build
          docker compose up -d

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install requirements for registration
        run: |
          pip install -r requirements.txt

      - name: Download production artifacts (Model + Vectorizer)
        run: |
          python scripts/register_best_model.py
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}

      - name: Prepare VM directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/mlops_election/model_registry
            sudo chown -R ${{ secrets.VM_USER }}:${{ secrets.VM_USER }} ~/mlops_election
            sudo chmod -R 755 ~/mlops_election

      - name: Copy artifacts to Azure VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "model_registry/"
          target: "~/mlops_election/"
          rm: false

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/mlops_election
            
            # Restart with docker-compose
            docker-compose down || true
            docker-compose up -d --build
            
            # Nettoyage
            docker image prune -f
