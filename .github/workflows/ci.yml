name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  PYTHONUNBUFFERED: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install training requirements
        run: |
          pip install -r requirements.txt

      - name: Configure DVC remote
        run: |
          dvc remote modify origin endpointurl https://dagshub.com/api/v1/repo-buckets/s3/AlaDdin0709
          dvc remote modify origin --local access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Pull data from DVC
        run: |
          dvc pull data/version1.xlsx.dvc
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: List data directory (Debug)
        run: |
          ls -R data/
          
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend requirements
        run: |
          pip install -r frontend/requirements.txt

      - name: Run training
        run: |
          python scripts/train.py
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}

      - name: Register best model
        run: |
          python scripts/register_best_model.py
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}

      - name: Install uvicorn (for smoke tests)
        run: |
          pip install "uvicorn[standard]"

      - name: Start backend (uvicorn)
        run: |
          nohup uvicorn backend.src.api:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo 000)
            echo "Attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "Backend did not become healthy"; exit 1

      - name: Smoke check backend endpoints
        run: |
          curl -sS http://localhost:8000/health

      - name: Build and deploy with Docker Compose (self-hosted)
        run: |
          docker compose build
          docker compose up -d

