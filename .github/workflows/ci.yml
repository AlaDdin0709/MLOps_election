name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  PYTHONUNBUFFERED: 1
  MLFLOW_EXPERIMENT: sentiment_classification_tunisian_v2

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install training requirements
        run: |
          pip install -r requirements.txt

      - name: Configure DVC remote
        run: |
          dvc remote modify origin endpointurl https://dagshub.com/api/v1/repo-buckets/s3/AlaDdin0709
          dvc remote modify origin access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          dvc remote modify origin secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Pull data from DVC
        run: |
          dvc pull -v
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Check data presence (Debug)
        run: |
          ls -R data/
          
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend requirements
        run: |
          pip install -r frontend/requirements.txt

      - name: Arize AI Monitoring & Drift Check
        id: monitoring
        run: |
          # Envoi automatique de la dernière version de donnée
          python scripts/monitor_arize.py
          
          # Vérification intelligente avec boucle d'attente
          python scripts/check_drift_and_retrain.py
        continue-on-error: true
        env:
          ARIZE_SPACE_KEY: ${{ secrets.ARIZE_SPACE_KEY }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

      - name: Run training (Conditional CT)
        # On entraîne SEULEMENT si :
        # - L'étape de monitoring a échoué (exit 1 -> Drift détecté)
        # - OU si c'est un push forcé sur master (optionnel)
        if: steps.monitoring.outcome == 'failure' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/train.py
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install requirements for registration
        run: |
          pip install -r requirements.txt

      - name: Download production artifacts (Model + Vectorizer)
        run: |
          python scripts/register_best_model.py
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}

      - name: Prepare VM directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/mlops_election/model_registry
            sudo chown -R ${{ secrets.VM_USER }}:${{ secrets.VM_USER }} ~/mlops_election
            sudo chmod -R 755 ~/mlops_election

      - name: Copy artifacts to Azure VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "model_registry/"
          target: "~/mlops_election/"
          rm: false

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/mlops_election
            
            # Ensure we are in a valid git repo (Fix for broken VM state)
            if [ ! -d ".git" ]; then
              echo "⚠️ .git not found. Initializing..."
              git init
              git remote add origin https://github.com/AlaDdin0709/mlops_election.git
            fi

            # Force sync with 'master'
            git fetch origin master
            git reset --hard origin/master
            
            # Restart with docker-compose
            docker-compose down || true
            docker-compose up -d --build
            
            # Clean up
            docker image prune -f
            #v1.0.0
